<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Prime Number Checker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .registration-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .card {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border: none;
        }
        .card-header h2 {
            margin: 0;
            font-weight: 600;
        }
        .card-header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        .card-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 2px solid #e0e0e0;
            border-right: none;
            background: #f8f9fa;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span {
            padding: 0 10px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        .social-register {
            display: flex;
            gap: 10px;
        }
        .btn-social {
            flex: 1;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            transition: all 0.3s ease;
        }
        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-social i {
            font-size: 1.2rem;
        }
        .btn-google {
            color: #db4437;
        }
        .btn-google:hover {
            background: #db4437;
            color: white;
            border-color: #db4437;
        }
        .btn-github {
            color: #333;
        }
        .btn-github:hover {
            background: #333;
            color: white;
            border-color: #333;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .link-primary {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .link-primary:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        .strength-weak {
            background: #dc3545;
            width: 33%;
        }
        .strength-medium {
            background: #ffc107;
            width: 66%;
        }
        .strength-strong {
            background: #28a745;
            width: 100%;
        }
        .invalid-feedback {
            display: block;
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="card">
            <div class="card-header">
                <h2><i class="bi bi-calculator"></i> Prime Number Checker</h2>
                <p class="subtitle">Create your account</p>
            </div>
            <div class="card-body">
                <div class="alert alert-info alert-dismissible fade show" id="demoAlert" role="alert">
                    <i class="bi bi-info-circle"></i> <strong>Demo Mode:</strong> Registration is simulated for demo purposes
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form id="registrationForm" novalidate>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="fullName" 
                                placeholder="Enter your full name"
                                required
                                minlength="3"
                            >
                        </div>
                        <div class="invalid-feedback" id="nameError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                        <div class="invalid-feedback" id="emailError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                placeholder="Create a password"
                                required
                                minlength="8"
                            >
                        </div>
                        <div class="password-strength" id="passwordStrength"></div>
                        <div class="invalid-feedback" id="passwordError"></div>
                        <small class="text-muted">Password must be at least 8 characters long</small>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="confirmPassword" 
                                placeholder="Confirm your password"
                                required
                            >
                        </div>
                        <div class="invalid-feedback" id="confirmPasswordError"></div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                I agree to the <a href="#" class="link-primary">Terms & Conditions</a>
                            </label>
                            <div class="invalid-feedback" id="termsError"></div>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-register">
                            <i class="bi bi-person-plus"></i> Create Account
                        </button>
                    </div>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-register">
                    <button class="btn btn-social btn-google" id="googleRegister">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button class="btn btn-social btn-github" id="githubRegister">
                        <i class="bi bi-github"></i> GitHub
                    </button>
                </div>

                <div class="text-center mt-4">
                    <p class="mb-0">Already have an account? <a href="login.html" class="link-primary">Sign In</a></p>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="index.html" class="text-white text-decoration-none">
                <i class="bi bi-house"></i> Go to Prime Checker
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const form = document.getElementById('registrationForm');
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const agreeTerms = document.getElementById('agreeTerms');

        // Password strength indicator
        password.addEventListener('input', function() {
            const strength = checkPasswordStrength(this.value);
            const strengthBar = document.getElementById('passwordStrength');
            
            strengthBar.className = 'password-strength';
            if (this.value.length > 0) {
                if (strength < 3) {
                    strengthBar.classList.add('strength-weak');
                } else if (strength < 5) {
                    strengthBar.classList.add('strength-medium');
                } else {
                    strengthBar.classList.add('strength-strong');
                }
            }
        });

        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;
            return strength;
        }

        // Form validation
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            // Reset errors
            clearErrors();
            
            // Validate full name
            if (fullName.value.trim().length < 3) {
                showError('nameError', 'Name must be at least 3 characters long');
                fullName.classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                showError('emailError', 'Please enter a valid email address');
                email.classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate password
            if (password.value.length < 8) {
                showError('passwordError', 'Password must be at least 8 characters long');
                password.classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate confirm password
            if (password.value !== confirmPassword.value) {
                showError('confirmPasswordError', 'Passwords do not match');
                confirmPassword.classList.add('is-invalid');
                isValid = false;
            }
            
            // Validate terms
            if (!agreeTerms.checked) {
                showError('termsError', 'You must agree to the terms and conditions');
                agreeTerms.classList.add('is-invalid');
                isValid = false;
            }
            
            if (isValid) {
                // Create user object
                const user = {
                    name: fullName.value,
                    email: email.value,
                    registered: true,
                    timestamp: new Date().toISOString()
                };
                
                // Store registered users (demo)
                let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                registeredUsers.push(user);
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                
                // Show success message
                showSuccess('Registration successful! Redirecting to login...');
                
                // Redirect to login page
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function clearErrors() {
            const errors = document.querySelectorAll('.invalid-feedback');
            errors.forEach(error => error.style.display = 'none');
            
            const inputs = document.querySelectorAll('.form-control, .form-check-input');
            inputs.forEach(input => input.classList.remove('is-invalid'));
        }

        // Social registration handlers
        document.getElementById('googleRegister').addEventListener('click', function() {
            showInfo('Google registration demo - Would redirect to Google OAuth');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });

        document.getElementById('githubRegister').addEventListener('click', function() {
            showInfo('GitHub registration demo - Would redirect to GitHub OAuth');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });

        // Helper functions
        function showSuccess(message) {
            showMessage(message, 'success');
        }

        function showInfo(message) {
            showMessage(message, 'info');
        }

        function showMessage(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="bi bi-check-circle"></i> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            form.parentNode.insertBefore(alert, form);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // Check if already logged in
        if (localStorage.getItem('user') || sessionStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
