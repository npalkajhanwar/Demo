<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prime Number Checker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        .card {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border: none;
        }
        .card-header h2 {
            margin: 0;
            font-weight: 600;
        }
        .card-header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        .card-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 2px solid #e0e0e0;
            border-right: none;
            background: #f8f9fa;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span {
            padding: 0 10px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        .social-login {
            display: flex;
            gap: 10px;
        }
        .btn-social {
            flex: 1;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            transition: all 0.3s ease;
        }
        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-social i {
            font-size: 1.2rem;
        }
        .btn-google {
            color: #db4437;
        }
        .btn-google:hover {
            background: #db4437;
            color: white;
            border-color: #db4437;
        }
        .btn-github {
            color: #333;
        }
        .btn-github:hover {
            background: #333;
            color: white;
            border-color: #333;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .link-primary {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .link-primary:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <h2><i class="bi bi-calculator"></i> Prime Number Checker</h2>
                <p class="subtitle">Sign in to continue</p>
            </div>
            <div class="card-body">
                <div class="alert alert-info alert-dismissible fade show" id="demoAlert" role="alert">
                    <i class="bi bi-info-circle"></i> <strong>Demo Mode:</strong> Use any email/password to login
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="link-primary" id="forgotPassword">Forgot Password?</a>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button class="btn btn-social btn-google" id="googleLogin">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button class="btn btn-social btn-github" id="githubLogin">
                        <i class="bi bi-github"></i> GitHub
                    </button>
                </div>

                <div class="text-center mt-4">
                    <p class="mb-0">Don't have an account? <a href="registration.html" class="link-primary">Sign Up</a></p>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="index.html" class="text-white text-decoration-none">
                <i class="bi bi-house"></i> Go to Prime Checker
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Simple demo authentication
            const user = {
                email: email,
                name: email.split('@')[0],
                loggedIn: true,
                timestamp: new Date().toISOString()
            };

            // Store user data
            if (rememberMe) {
                localStorage.setItem('user', JSON.stringify(user));
            } else {
                sessionStorage.setItem('user', JSON.stringify(user));
            }

            // Show success message
            showSuccess('Login successful! Redirecting...');
            
            // Redirect to main page
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });

        // Social login handlers
        document.getElementById('googleLogin').addEventListener('click', function() {
            showInfo('Google login demo - Would redirect to Google OAuth');
            setTimeout(() => {
                const user = {
                    email: 'user@gmail.com',
                    name: 'Google User',
                    loggedIn: true,
                    provider: 'google'
                };
                sessionStorage.setItem('user', JSON.stringify(user));
                window.location.href = 'index.html';
            }, 1500);
        });

        document.getElementById('githubLogin').addEventListener('click', function() {
            showInfo('GitHub login demo - Would redirect to GitHub OAuth');
            setTimeout(() => {
                const user = {
                    email: 'user@github.com',
                    name: 'GitHub User',
                    loggedIn: true,
                    provider: 'github'
                };
                sessionStorage.setItem('user', JSON.stringify(user));
                window.location.href = 'index.html';
            }, 1500);
        });

        // Forgot password handler
        document.getElementById('forgotPassword').addEventListener('click', function(e) {
            e.preventDefault();
            showInfo('Password reset demo - Would send reset email');
        });

        // Helper functions
        function showSuccess(message) {
            showMessage(message, 'success');
        }

        function showInfo(message) {
            showMessage(message, 'info');
        }

        function showMessage(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="bi bi-check-circle"></i> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            const form = document.getElementById('loginForm');
            form.parentNode.insertBefore(alert, form);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // Check if already logged in
        if (localStorage.getItem('user') || sessionStorage.getItem('user')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
