<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prime Number Checker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: none;
            border-radius: 15px;
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h2 class="mb-0">🔐 Login</h2>
                        <p class="mb-0 mt-2">Access Prime Number Checker</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertContainer"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email Address</label>
                                <input 
                                    type="email" 
                                    class="form-control form-control-lg" 
                                    id="emailInput" 
                                    placeholder="Enter your email"
                                    required
                                >
                                <div class="invalid-feedback">
                                    Please provide a valid email address.
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label">Password</label>
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg" 
                                    id="passwordInput" 
                                    placeholder="Enter your password"
                                    required
                                    minlength="6"
                                >
                                <div class="invalid-feedback">
                                    Password must be at least 6 characters long.
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Login
                                </button>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">Don't have an account? 
                                <a href="register.html" class="text-decoration-none fw-bold">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const rememberMe = document.getElementById('rememberMe');
        const alertContainer = document.getElementById('alertContainer');

        // Show alert message
        function showAlert(message, type = 'danger') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                if (alert && alert.parentElement) {
                    alert.remove();
                }
            }, 5000);
        }

        // Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Form submission handler
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous validation states
            form.classList.remove('was-validated');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Validate form
            let isValid = true;
            
            if (!email || !isValidEmail(email)) {
                emailInput.classList.add('is-invalid');
                isValid = false;
            } else {
                emailInput.classList.remove('is-invalid');
                emailInput.classList.add('is-valid');
            }
            
            if (!password || password.length < 6) {
                passwordInput.classList.add('is-invalid');
                isValid = false;
            } else {
                passwordInput.classList.remove('is-invalid');
                passwordInput.classList.add('is-valid');
            }
            
            if (!isValid) {
                showAlert('Please correct the errors in the form.', 'danger');
                return;
            }
            
            // Check if user is registered (basic validation for demo purposes)
            // NOTE: This is a DEMO implementation. Passwords are NOT checked for security reasons.
            // In production, authentication MUST be done server-side with:
            // - Proper password hashing (bcrypt, Argon2, etc.)
            // - HTTPS for secure transmission
            // - JWT or secure session tokens
            // - Protection against timing attacks, brute force, etc.
            const registeredUser = localStorage.getItem('registeredUser');
            if (registeredUser) {
                try {
                    const userData = JSON.parse(registeredUser);
                    if (userData.email !== email) {
                        showAlert('Invalid email or password. Please register if you don\'t have an account.', 'danger');
                        return;
                    }
                } catch (e) {
                    // If parsing fails, continue with login (backward compatibility)
                }
            }
            
            // Simulate login (in a real app, this would be an API call)
            showAlert('Login successful! Redirecting...', 'success');
            
            // Store login state
            if (rememberMe.checked) {
                localStorage.setItem('userEmail', email);
                localStorage.setItem('isLoggedIn', 'true');
            } else {
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('isLoggedIn', 'true');
            }
            
            // Redirect to main app after 1.5 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });

        // Focus on email input when page loads
        window.addEventListener('load', function() {
            emailInput.focus();
        });

        // Check if user is already logged in
        if (localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true') {
            showAlert('You are already logged in. Redirecting...', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
